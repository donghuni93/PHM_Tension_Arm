<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>25년 3조 뷰어</title>
<style>
:root {
  color-scheme: light;
  --bg: #f4f3ef; --surface: #fcfcfb; --surface-2: #f0efec; --border: #dddcd6;
  --text: #0b0b0b; --text-2: #52514e; --text-3: #85847e;
  --nor: #2a78d6; --abn: #eb6834; --nor-band: rgba(42,120,214,.16);
  --grid: #e6e5e0; --axis: #b9b8b1; --hl: #fff1c2; --accent: #2a78d6;
  --ov1: rgba(98,80,214,.10); --ov2: rgba(27,175,122,.12);
  --val: #85847e; --d25: #1baf7a; --d26: #6250d6;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --bg: #121211; --surface: #1a1a19; --surface-2: #232321; --border: #383835;
    --text: #f0efec; --text-2: #c3c2b7; --text-3: #8d8c84;
    --nor: #3987e5; --abn: #d95926; --nor-band: rgba(57,135,229,.22);
    --grid: #2b2b29; --axis: #55544f; --hl: #4a3f17; --accent: #3987e5;
    --ov1: rgba(144,133,233,.14); --ov2: rgba(25,158,112,.16);
    --val: #8d8c84; --d25: #199e70; --d26: #9085e9;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --bg: #121211; --surface: #1a1a19; --surface-2: #232321; --border: #383835;
  --text: #f0efec; --text-2: #c3c2b7; --text-3: #8d8c84;
  --nor: #3987e5; --abn: #d95926; --nor-band: rgba(57,135,229,.22);
  --grid: #2b2b29; --axis: #55544f; --hl: #4a3f17; --accent: #3987e5;
  --ov1: rgba(144,133,233,.14); --ov2: rgba(25,158,112,.16);
  --val: #8d8c84; --d25: #199e70; --d26: #9085e9;
}
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--bg); color: var(--text);
  font: 13px/1.45 "Malgun Gothic", "Apple SD Gothic Neo", "Noto Sans KR", system-ui, sans-serif; }
header { position: sticky; top: 0; z-index: 5; background: var(--surface); border-bottom: 1px solid var(--border); padding: 8px 16px; }
header h1 { font-size: 15px; margin: 0 12px 0 0; display: inline-block; }
.bar { display: flex; flex-wrap: wrap; gap: 6px 14px; align-items: center; }
.ctl { display: inline-flex; align-items: center; gap: 4px; color: var(--text-2); }
select, input[type=text] { font: inherit; color: var(--text); background: var(--surface-2); border: 1px solid var(--border); border-radius: 6px; padding: 3px 6px; }
.seg { display: inline-flex; border: 1px solid var(--border); border-radius: 7px; overflow: hidden; vertical-align: middle; }
.seg button { font: inherit; border: 0; background: var(--surface-2); color: var(--text-2); padding: 3px 10px; cursor: pointer; }
.seg button + button { border-left: 1px solid var(--border); }
.seg button.on { background: var(--accent); color: #fff; }
.layout { display: grid; grid-template-columns: 250px 1fr; min-height: calc(100vh - 90px); }
aside { border-right: 1px solid var(--border); background: var(--surface); padding: 10px; overflow: auto; max-height: calc(100vh - 50px); position: sticky; top: 50px; }
aside h3 { font-size: 12px; color: var(--text-2); margin: 10px 0 4px; font-weight: 600; }
.taglist div { display: flex; justify-content: space-between; gap: 6px; padding: 2px 6px; border-radius: 5px; cursor: pointer; }
.taglist div:hover, .flist div:hover, .clist div:hover { background: var(--surface-2); }
.taglist div.on { background: var(--hl); }
.taglist .cnt { color: var(--text-3); font-variant-numeric: tabular-nums; white-space: nowrap; }
.flist div, .clist div { padding: 1px 6px; border-radius: 4px; cursor: pointer; display: flex; gap: 6px; align-items: center; font-variant-numeric: tabular-nums; }
.flist div.cur, .clist div.cur { background: var(--hl); font-weight: 600; }
.flist .gh, .clist .gh { cursor: default; color: var(--text-2); font-weight: 600; margin-top: 6px; }
.dot { width: 8px; height: 8px; border-radius: 50%; flex: none; display: inline-block; }
.dot.n { background: var(--nor); } .dot.a { background: var(--abn); } .dot.v { background: var(--val); }
.chip.lab-v { border-color: var(--val); color: var(--text); }
/* 3조 노트북 · 비교 */
.nbcell { margin-bottom: 14px; }
.nbcell pre { margin: 0; padding: 8px 10px; background: var(--surface-2); border-radius: 6px; overflow: auto; max-height: 420px; font: 12px/1.45 Consolas, "D2Coding", monospace; white-space: pre; }
.nbcell pre.out { background: transparent; border: 1px dashed var(--border); max-height: 300px; }
.nbcell img { max-width: 100%; background: #fff; border-radius: 6px; margin-top: 6px; }
.nbcell .src.fold { max-height: 160px; }
.cmpgrid { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 12px; }
table.plain { border-collapse: collapse; font-variant-numeric: tabular-nums; }
table.plain td, table.plain th { padding: 3px 10px; border-bottom: 1px solid var(--grid); text-align: left; }
table.plain th { color: var(--text-2); font-weight: 600; }
table.plain td.r { text-align: right; white-space: nowrap; }
table.plain td:first-child, table.plain th { white-space: nowrap; }
.flist .badge { margin-left: auto; color: var(--text-3); font-size: 11px; }
main { padding: 12px 16px 40px; min-width: 0; }
.card { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 10px 12px; margin-bottom: 12px; min-width: 0; }
.card h4 { margin: 0 0 6px; font-size: 12px; color: var(--text-2); font-weight: 600; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.title { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
.title .nm { font-size: 18px; font-weight: 700; }
.chip { display: inline-block; padding: 1px 8px; border-radius: 10px; font-size: 11px; background: var(--surface-2); color: var(--text-2); border: 1px solid var(--border); }
.chip.lab-n { border-color: var(--nor); color: var(--text); } .chip.lab-a { border-color: var(--abn); color: var(--text); }
.chip.warn { background: var(--hl); color: var(--text); }
canvas { display: block; width: 100%; }
.row2 { display: grid; grid-template-columns: 1fr 2fr; gap: 12px; }
.row2e { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.feats { display: grid; grid-template-columns: repeat(auto-fit, minmax(380px, 1fr)); gap: 12px; }
.ftable { width: 100%; border-collapse: collapse; }
.ftable td { padding: 2px 4px; border-bottom: 1px solid var(--grid); vertical-align: middle; }
.ftable td.v { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
.ftable td.p { width: 110px; }
.ftable tr.out td { background: var(--hl); }
.lnk { cursor: pointer; text-decoration: underline dotted var(--text-3); text-underline-offset: 3px; }
.lnk:hover { color: var(--accent); }
.track { position: relative; height: 12px; background: var(--surface-2); border-radius: 6px; }
.track .band { position: absolute; top: 0; bottom: 0; left: 5%; width: 90%; background: var(--nor-band); border-radius: 6px; }
.track .mid { position: absolute; top: 1px; bottom: 1px; left: 50%; width: 1px; background: var(--nor); opacity: .6; }
.track .mk { position: absolute; top: 1px; width: 10px; height: 10px; margin-left: -5px; border-radius: 50%; border: 2px solid var(--surface); }
.track .mk.ghost { background: transparent; border: 1.5px solid var(--text-3); }
.ftable td.o2 { color: var(--text-3); font-size: 11px; }
.sigbar { font-weight: 600; color: var(--text); }
.pv { font-size: 11px; color: var(--text-3); width: 34px; text-align: right; font-variant-numeric: tabular-nums; }
.five .fcard { display: grid; grid-template-columns: 200px 1.4fr 1fr; gap: 10px; align-items: start; }
.five .meta { font-size: 12px; }
.five .meta .nm { font-weight: 700; font-size: 14px; cursor: pointer; }
.five .meta table { border-collapse: collapse; margin-top: 4px; }
.five .meta td { padding: 0 4px 0 0; font-variant-numeric: tabular-nums; }
.five .meta tr.out td { background: var(--hl); }
.tbl-wrap { overflow: auto; max-height: calc(100vh - 140px); border: 1px solid var(--border); border-radius: 10px; background: var(--surface); }
table.big { border-collapse: separate; border-spacing: 0; font-variant-numeric: tabular-nums; font-size: 12px; }
table.big th, table.big td { padding: 3px 6px; border-bottom: 1px solid var(--grid); white-space: nowrap; text-align: right; }
table.big th { position: sticky; top: 0; background: var(--surface-2); z-index: 2; cursor: pointer; font-weight: 600; color: var(--text-2); }
table.big th.s { color: var(--text); text-decoration: underline; }
table.big td.o { background: var(--hl); font-weight: 700; }
table.big td:first-child, table.big th:first-child { position: sticky; left: 0; background: var(--surface); text-align: left; z-index: 1; }
table.big th:first-child { z-index: 3; background: var(--surface-2); }
table.big tr:hover td { background: var(--surface-2); }
.tip { position: fixed; pointer-events: none; background: var(--surface); border: 1px solid var(--border); border-radius: 6px; padding: 4px 8px; font-size: 12px; box-shadow: 0 2px 8px rgba(0,0,0,.15); display: none; z-index: 30; white-space: nowrap; }
.legend { display: inline-flex; gap: 10px; font-weight: 400; color: var(--text-2); font-size: 11px; flex-wrap: wrap; }
.legend i { display: inline-block; width: 14px; height: 3px; vertical-align: middle; margin-right: 3px; border-radius: 2px; }
.legend i.bandsw { height: 9px; background: var(--nor-band); }
.help { color: var(--text-3); font-size: 12px; font-weight: 400; }
.kbd { border: 1px solid var(--border); border-radius: 4px; padding: 0 4px; font-size: 11px; background: var(--surface-2); }
.bands { display: grid; grid-template-columns: repeat(var(--nb, 13), 1fr); gap: 3px; align-items: end; height: 70px; }
.bands div { position: relative; background: var(--surface-2); border-radius: 3px; height: 100%; }
.bands div span { position: absolute; left: 0; right: 0; bottom: 0; border-radius: 3px; }
.bands-x { display: grid; grid-template-columns: repeat(var(--nb, 13), 1fr); gap: 3px; font-size: 10px; color: var(--text-3); text-align: center; }
.navbtn { font: inherit; border: 1px solid var(--border); background: var(--surface-2); color: var(--text); border-radius: 6px; padding: 2px 10px; cursor: pointer; }
/* 개념 */
.drawer { position: fixed; top: 0; right: 0; bottom: 0; width: min(520px, 100vw); background: var(--surface); border-left: 1px solid var(--border); box-shadow: -4px 0 16px rgba(0,0,0,.12); z-index: 20; padding: 14px 16px 30px; overflow: auto; transform: translateX(105%); transition: transform .18s; }
.drawer.open { transform: none; }
.drawer .x { position: absolute; top: 8px; right: 10px; }
.concept h2 { font-size: 17px; margin: 0 0 2px; }
.concept .sec { color: var(--text-3); font-size: 12px; margin-bottom: 8px; }
.concept dl { margin: 0; }
.concept dt { font-weight: 700; font-size: 12px; margin-top: 8px; }
.concept dt.k-data { color: var(--accent); }
.concept dt.k-warn { color: var(--abn); }
.concept dd { margin: 2px 0 0; }
.concept code { background: var(--surface-2); padding: 0 4px; border-radius: 4px; font-size: 12px; }
.concept .rel { margin-top: 12px; display: flex; flex-wrap: wrap; gap: 4px; }
.concept .rel .chip { cursor: pointer; }
.note { border-left: 3px solid var(--accent); padding: 6px 10px; background: var(--surface-2); border-radius: 0 6px 6px 0; margin-bottom: 12px; }
.cgrid { display: grid; grid-template-columns: 260px 1fr; gap: 12px; }
@media (max-width: 900px) {
  .layout { grid-template-columns: 1fr; } aside { position: static; max-height: 240px; border-right: 0; border-bottom: 1px solid var(--border); }
  .row2, .row2e, .five .fcard, .cgrid { grid-template-columns: 1fr; } .feats { grid-template-columns: 1fr; }
}
</style>
</head>
<body>
<header>
  <div class="bar">
    <h1>25년 3조 뷰어 <span class="help">25년 데이터 5 kHz × 10초</span></h1>
    <span class="seg" id="mode">
      <button data-v="one" class="on">한 개씩</button><button data-v="five">5개씩</button><button data-v="table">표</button><button data-v="scatter">산점도</button><button data-v="nb">3조 노트북</button><button data-v="cmp">25↔26 비교</button><button data-v="concept">개념</button>
    </span>
    <span class="ctl sigbar" title="모든 그림·지표·태그·정상 백분위를 이 신호로 계산한 값으로 바꾼다">신호 <span class="seg" id="sig"><button data-v="raw">평균 제거</button><button data-v="hp">200 Hz 고역통과</button></span></span>
    <span class="ctl">라벨 <select id="fLab"><option value="all">전체</option><option value="0">정상</option><option value="1">고장</option><option value="-1">val (라벨 없음)</option></select></span>
    <span class="ctl">3조 결과 <select id="fModel">
      <option value="all">전체</option>
      <option value="miss">train 미탐 (3/5 이상)</option><option value="fp">train 오경보 (3/5 이상)</option><option value="any_err">train 틀림</option>
      <option value="v1">val 고장 예측 (0.20)</option><option value="v0">val 정상 예측</option><option value="vnear">val 경계 (확률 0.1–0.4)</option>
    </select></span>
    <span class="ctl">정렬 <select id="sortKey"></select>
      <span class="seg" id="sortDir"><button data-v="1" class="on">↑</button><button data-v="-1">↓</button></span></span>
    <span class="ctl">묶기 <select id="groupBy"><option value="label">라벨</option><option value="none">없음</option><option value="model">3조 결과</option></select></span>
    <span class="ctl"><input type="text" id="q" placeholder="파일 찾기 (예: 017)" size="14"></span>
    <span class="help" id="status"></span>
  </div>
</header>
<div class="layout">
  <aside id="aside"></aside>
  <main id="main"></main>
</div>
<div class="drawer" id="drawer"><button class="navbtn x" id="dx">닫기 ✕</button><div id="dbody"></div></div>
<div class="tip" id="tip"></div>

<script id="data" type="application/json">__DATA_JSON__</script>
<script>
"use strict";
const D = JSON.parse(document.getElementById("data").textContent);
const N = D.names.length;
const bytes = s => { const b = atob(s), u = new Uint8Array(b.length); for (let i = 0; i < b.length; i++) u[i] = b.charCodeAt(i); return u; };
const i16 = s => new Int16Array(bytes(s).buffer);
const ENV = i16(D.env);
const NB = D.nb, NZ = D.nz, NF = D.nf, [SF, ST] = D.spec_shape;
const FEAT = Object.fromEntries(D.feat.map(f => [f.key, f]));
const CON = Object.fromEntries(D.concepts.map(c => [c.key, c]));
const GRP = Object.fromEntries(D.groups.map(g => [g.key, g]));

// ---------- 상태 ----------
const S = { mode: "one", lab: "all", model: "all", tag: null, sort: "name", dir: 1, group: "label", q: "", sig: "raw",
            list: [], pos: 0, psdLog: true, shareY: false, sx: "std", sy: "prot", lx: true, ly: true,
            ovP: false, ovG: false, ckey: "tension-arm", cq: "" };
try { Object.assign(S, JSON.parse(localStorage.getItem("eda-viewer25") || "{}"), { list: [] }); } catch (e) {}
const save = () => { try { const { list, ...k } = S; localStorage.setItem("eda-viewer25", JSON.stringify(k)); } catch (e) {} };
document.documentElement.style.setProperty("--nb", D.nbands);

// ---------- 신호 전환: 평균 제거(raw) / 200 Hz 고역통과(hp). 지표·태그·그림 데이터 한 벌씩 미리 계산돼 있다 ----------
let ZOOM, PSD, SKA, ENVS, WIN, SPEC, TAG;
const DEC = {};
function useSig(s) {
  if (!D.sets[s]) s = "raw";
  S.sig = s; const set = D.sets[s];
  if (!DEC[s]) DEC[s] = { zoom: i16(set.bin.zoom), psd: i16(set.bin.psd), sk: i16(set.bin.sk), envs: i16(set.bin.envs), win: i16(set.bin.win), spec: bytes(set.bin.spec) };
  ({ zoom: ZOOM, psd: PSD, sk: SKA, envs: ENVS, win: WIN, spec: SPEC } = DEC[s]);
  for (const k of ["val", "pct", "ref", "tags", "ftags", "events", "psdref", "skref", "envref", "wref", "zoom_start"]) D[k] = set[k];
  TAG = Object.fromEntries(D.tags.map(t => [t.key, t]));
}
const otherSig = () => S.sig === "hp" ? "raw" : "hp";
const sigName = s => D.sig_names[s || S.sig];
useSig(S.sig);

// ---------- 공용 ----------
const css = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
// 라벨: 0 정상 · 1 고장 · −1 val(라벨 없음)
const isA = i => D.y[i] === 1, isV = i => D.y[i] === -1;
const col = i => isV(i) ? css("--val") : isA(i) ? css("--abn") : css("--nor");
const dcls = i => isV(i) ? "v" : isA(i) ? "a" : "n";
const labName = i => isV(i) ? "val" : isA(i) ? "고장" : "정상";
const pfmt = p => p === null || p === undefined ? "—" : p.toFixed(2);
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const fmt = (v, k) => {
  if (v === null || v === undefined || Number.isNaN(v)) return "—";
  const a = Math.abs(v);
  if (k === "n_imp" || k === "n_out") return String(Math.round(v));
  if (a !== 0 && (a < 0.001 || a >= 1e5)) return v.toExponential(2);
  if (a >= 100) return v.toFixed(0);
  if (a >= 10) return v.toFixed(1);
  if (a >= 1) return v.toFixed(2);
  return v.toPrecision(3);
};
// 3조 결과: train = 우리 중첩 CV(seed 5번 중 미탐·오경보 횟수), val = 전체 train 학습 확률 (thr 0.20 = 3조 제출)
const M = D.models.svm;
const wrong = i => !isV(i) && (isA(i) ? M.miss[i] >= 3 : M.fp[i] >= 3);
function modelPass(i) {
  switch (S.model) {
    case "miss": return isA(i) && M.miss[i] >= 3; case "fp": return D.y[i] === 0 && M.fp[i] >= 3; case "any_err": return wrong(i);
    case "v1": return isV(i) && D.val_pred[i - (N - D.val_pred.length)] === 1; case "v0": return isV(i) && D.val_pred[i - (N - D.val_pred.length)] === 0;
    case "vnear": return isV(i) && D.prob[i] >= 0.1 && D.prob[i] <= 0.4; default: return true;
  }
}
function groupOf(i) {
  if (S.group === "label") return labName(i);
  if (S.group === "model") {
    if (isV(i)) return D.prob[i] >= D.thr_submit ? "val: 3조 고장 예측" : "val: 3조 정상 예측";
    if (isA(i)) return M.miss[i] >= 3 ? "고장: 미탐" : "고장: 잡음";
    return M.fp[i] >= 3 ? "정상: 오경보" : "정상: 문제 없음";
  }
  return "";
}
function rebuild(keepFile) {
  const cur = S.list[S.pos], L = [];
  for (let i = 0; i < N; i++) {
    if (S.lab !== "all" && String(D.y[i]) !== S.lab) continue;
    if (!modelPass(i)) continue;
    if (S.tag && !D.ftags[i].includes(S.tag)) continue;
    if (S.q && !D.names[i].includes(S.q)) continue;
    L.push(i);
  }
  const key = i => S.sort === "name" ? i : (D.val[S.sort][i] ?? (S.dir > 0 ? Infinity : -Infinity));
  L.sort((a, b) => { const g = groupOf(a).localeCompare(groupOf(b), "ko"); if (S.group !== "none" && g) return g; return (key(a) - key(b)) * S.dir || a - b; });
  S.list = L;
  const p = L.indexOf(keepFile !== undefined ? keepFile : cur); S.pos = p >= 0 ? p : 0;
}

// ---------- 캔버스 ----------
function canvas(h) { const c = document.createElement("canvas"); c.style.height = h + "px"; return c; }
function ctx2d(c) {
  const r = window.devicePixelRatio || 1, w = c.clientWidth, h = c.clientHeight;
  c.width = Math.round(w * r); c.height = Math.round(h * r);
  const g = c.getContext("2d"); g.setTransform(r, 0, 0, r, 0, 0); g.font = "11px Malgun Gothic, sans-serif"; return [g, w, h];
}
function frame(g, w, h, P, xt, yt, xl, yl) {
  g.strokeStyle = css("--grid"); g.lineWidth = 1; g.fillStyle = css("--text-3"); g.textBaseline = "middle";
  for (const [, x, lab] of xt) { g.beginPath(); g.moveTo(x, P.t); g.lineTo(x, h - P.b); g.stroke(); g.textAlign = "center"; g.fillText(lab, x, h - P.b + 10); }
  for (const [, y, lab] of yt) { g.beginPath(); g.moveTo(P.l, y); g.lineTo(w - P.r, y); g.stroke(); g.textAlign = "right"; g.fillText(lab, P.l - 4, y); }

function diffCmp(c) {

function aucPlot(c) {

// ---------- 옆 목록·태그 ----------
function renderSide() {
  const A = document.getElementById("aside");
  const cnt = f => { const c = [0, 0, 0]; for (let i = 0; i < N; i++) if (f(i)) c[isV(i) ? 2 : isA(i) ? 1 : 0]++; return c.join(" / "); };
  let h = `<h3>태그 (클릭 = 거르기, 정상 / 고장 / val 수)</h3><div class="taglist"><div data-t="" class="${S.tag ? "" : "on"}"><span>모든 태그</span><span class="cnt">${cnt(() => true)}</span></div>` +
    D.tags.map(t => `<div data-t="${t.key}" class="${S.tag === t.key ? "on" : ""}" title="${esc(t.desc)}"><span>${t.label}</span><span class="cnt">${cnt(i => D.ftags[i].includes(t.key))}</span></div>`).join("") + `</div>`;
  const cur = S.list[S.pos], p0 = Math.floor(S.pos / 5) * 5; let lastG = null, fl = "";
  S.list.forEach((i, p) => {
    const g = groupOf(i); if (S.group !== "none" && g !== lastG) { fl += `<div class="gh">${g}</div>`; lastG = g; }
    const on = S.mode === "five" ? p >= p0 && p < p0 + 5 : i === cur, sv = S.sort !== "name" ? fmt(D.val[S.sort][i], S.sort) : "";

  });
  h += `<h3>파일 ${S.list.length}개${S.sort !== "name" ? " · 오른쪽 = " + FEAT[S.sort].label : ""}</h3><div class="flist">${fl || '<span class="help">없음</span>'}</div>`;
  A.innerHTML = h;
  A.querySelectorAll(".taglist div").forEach(d => d.onclick = () => { S.tag = d.dataset.t || null; update(); });
  A.querySelectorAll(".flist div[data-p]").forEach(d => d.onclick = () => { S.pos = +d.dataset.p; if (!["one", "five"].includes(S.mode)) S.mode = "one"; syncCtl(); render(); });

// ---------- 컨트롤 ----------
function segBind(id, fn) { document.querySelectorAll(`#${id} button`).forEach(b => b.onclick = () => fn(b.dataset.v)); }
function syncCtl() {
  document.querySelectorAll("#mode button").forEach(b => b.classList.toggle("on", b.dataset.v === S.mode));
  document.querySelectorAll("#sortDir button").forEach(b => b.classList.toggle("on", +b.dataset.v === S.dir));
  document.querySelectorAll("#sig button").forEach(b => b.classList.toggle("on", b.dataset.v === S.sig));
  document.getElementById("fLab").value = S.lab; document.getElementById("fModel").value = S.model;
  document.getElementById("sortKey").value = S.sort; document.getElementById("groupBy").value = S.group; document.getElementById("q").value = S.q;
}
function setMode(m) { S.mode = m; syncCtl(); render(); }
function step(d) { if (!S.list.length) return; S.pos = Math.max(0, Math.min(S.list.length - 1, S.pos + d)); render(); }
function update() { rebuild(); render(); }
function render() {
  save(); tip.style.display = "none";
  ({ one: renderOne, five: renderFive, table: renderTable, scatter: renderScatter, nb: renderNB, cmp: renderCmp, concept: renderConcept })[S.mode]();
  renderSide();
  document.getElementById("status").innerHTML = S.mode === "one" ? `<span class="kbd">←</span> <span class="kbd">→</span> 파일 이동` : S.mode === "five" ? `<span class="kbd">←</span> <span class="kbd">→</span> 5개씩 이동` : "";
}
document.getElementById("sortKey").innerHTML = `<option value="name">파일 이름</option>` + featOptions();
segBind("mode", v => setMode(v));
segBind("sortDir", v => { S.dir = +v; syncCtl(); update(); });
segBind("sig", v => { useSig(v); if (S.tag && !TAG[S.tag]) S.tag = null; syncCtl(); rebuild(); render(); });
document.getElementById("fLab").onchange = e => { S.lab = e.target.value; update(); };
document.getElementById("fModel").onchange = e => { S.model = e.target.value; update(); };
document.getElementById("sortKey").onchange = e => { S.sort = e.target.value; update(); };
document.getElementById("groupBy").onchange = e => { S.group = e.target.value; update(); };

addEventListener("keydown", e => {
  if (e.key === "Escape") return closeDrawer();
  if (["INPUT", "SELECT"].includes(e.target.tagName)) return;
  const k = S.mode === "five" ? 5 : 1;
  if (!["one", "five"].includes(S.mode)) return;
  if (e.key === "ArrowRight") { step(k); e.preventDefault(); } else if (e.key === "ArrowLeft") { step(-k); e.preventDefault(); }
});
let rt; addEventListener("resize", () => { clearTimeout(rt); rt = setTimeout(render, 150); });

if (S.sort !== "name" && !FEAT[S.sort]) S.sort = "name";
if (!FEAT[S.sx]) S.sx = "std"; if (!FEAT[S.sy]) S.sy = "prot"; if (!CON[S.ckey]) S.ckey = D.concepts[0].key;
const hm = location.hash.slice(1); if (["one", "five", "table", "scatter", "nb", "cmp", "concept"].includes(hm)) S.mode = hm;
if (!["one", "five", "table", "scatter", "nb", "cmp", "concept"].includes(S.mode)) S.mode = "one";
syncCtl(); rebuild(); render();
