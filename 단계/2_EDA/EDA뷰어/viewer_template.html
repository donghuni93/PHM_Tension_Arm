<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>텐션암 EDA 뷰어</title>
<style>
:root {
  color-scheme: light;
  --bg: #f3f2ee; --surface: #fdfdfc; --surface-2: #f1f0ec; --surface-3: #e9e8e3; --border: #e0dfd9; --border-2: #cfcec7;
  --text: #121212; --text-2: #4f4e4a; --text-3: #8a8983;
  --nor: #2a78d6; --abn: #eb6834; --nor-band: rgba(42,120,214,.15);
  --grid: #ebeae5; --axis: #b9b8b1; --hl: #fff1c2; --accent: #2a78d6; --accent-soft: rgba(42,120,214,.10);
  --ov1: rgba(98,80,214,.10); --ov2: rgba(27,175,122,.12);
  --val: #8a63d2; --r83: #7a3db8; --knock: #1a9e5a; --lock: #b8860b; --cap: #6b7280; --res83: #c2185b; --body: #0e7490; --e2: #e8590c;
  --nav-bg: #1f2328; --nav-2: #2a2f36; --nav-text: #c9ced6; --nav-text-2: #7d8590; --nav-on: #ffffff;
  --shadow: 0 1px 2px rgba(20,20,20,.04), 0 2px 8px rgba(20,20,20,.05);
  --navw: 212px; --hdr: 52px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --bg: #111110; --surface: #191918; --surface-2: #222220; --surface-3: #2b2b29; --border: #31312e; --border-2: #45453f;
    --text: #f0efec; --text-2: #c3c2b7; --text-3: #8d8c84;
    --nor: #3987e5; --abn: #e0652f; --nor-band: rgba(57,135,229,.22);
    --grid: #262624; --axis: #55544f; --hl: #4a3f17; --accent: #4a94ec; --accent-soft: rgba(74,148,236,.16);
    --ov1: rgba(144,133,233,.14); --ov2: rgba(25,158,112,.16);
    --val: #a98bef; --r83: #b38ae6; --knock: #3fc283; --lock: #e0b84a; --cap: #9ca3af; --res83: #f06292; --body: #22b8cf; --e2: #ff922b;
    --nav-bg: #0b0c0e; --nav-2: #1b1e23; --nav-text: #c9ced6; --nav-text-2: #6e7681; --nav-on: #ffffff;
    --shadow: 0 1px 2px rgba(0,0,0,.3);
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --bg: #111110; --surface: #191918; --surface-2: #222220; --surface-3: #2b2b29; --border: #31312e; --border-2: #45453f;
  --text: #f0efec; --text-2: #c3c2b7; --text-3: #8d8c84;
  --nor: #3987e5; --abn: #e0652f; --nor-band: rgba(57,135,229,.22);
  --grid: #262624; --axis: #55544f; --hl: #4a3f17; --accent: #4a94ec; --accent-soft: rgba(74,148,236,.16);
  --ov1: rgba(144,133,233,.14); --ov2: rgba(25,158,112,.16);
  --val: #a98bef; --r83: #b38ae6; --knock: #3fc283; --lock: #e0b84a; --cap: #9ca3af; --res83: #f06292; --body: #22b8cf; --e2: #ff922b;
  --nav-bg: #0b0c0e; --nav-2: #1b1e23; --nav-text: #c9ced6; --nav-text-2: #6e7681; --nav-on: #ffffff;
  --shadow: 0 1px 2px rgba(0,0,0,.3);
}
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--bg); color: var(--text);
  font: 13px/1.5 "Pretendard", "Pretendard Variable", "Malgun Gothic", "Apple SD Gothic Neo", "Noto Sans KR", system-ui, sans-serif; }
::-webkit-scrollbar { width: 10px; height: 10px; } ::-webkit-scrollbar-thumb { background: var(--border-2); border-radius: 6px; border: 2px solid transparent; background-clip: padding-box; }
.app { display: grid; grid-template-columns: var(--navw) minmax(0, 1fr); min-height: 100vh; }
.app.mini { --navw: 56px; }
/* ---- 왼쪽 메뉴 (VS Code 액티비티 바 + 탐색기) ---- */
nav.act { position: sticky; top: 0; height: 100vh; overflow: auto; background: var(--nav-bg); color: var(--nav-text); display: flex; flex-direction: column; z-index: 6; }
.brand { display: flex; align-items: center; gap: 10px; padding: 14px 14px 12px; border-bottom: 1px solid var(--nav-2); }
.brand .logo { width: 28px; height: 28px; border-radius: 8px; flex: none; background: linear-gradient(135deg, var(--nor), var(--abn)); display: grid; place-items: center; color: #fff; font-weight: 800; font-size: 13px; }
.brand b { display: block; color: var(--nav-on); font-size: 13.5px; letter-spacing: -.01em; }
.brand span { display: block; color: var(--nav-text-2); font-size: 11px; }
.nsec { padding: 12px 8px 2px; }
.nsec h5 { margin: 0 0 4px 8px; font-size: 10.5px; letter-spacing: .08em; color: var(--nav-text-2); font-weight: 700; }
.nitem { display: flex; align-items: center; gap: 10px; padding: 6px 10px; margin: 1px 0; border-radius: 7px; cursor: pointer; position: relative; color: var(--nav-text); white-space: nowrap; }
.nitem:hover { background: var(--nav-2); color: var(--nav-on); }
.nitem.on { background: var(--nav-2); color: var(--nav-on); font-weight: 600; }
.nitem.on::before { content: ""; position: absolute; left: -8px; top: 6px; bottom: 6px; width: 3px; border-radius: 0 3px 3px 0; background: var(--accent); }
.nitem svg { width: 18px; height: 18px; flex: none; stroke: currentColor; fill: none; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
.nitem .nh { margin-left: auto; font-size: 10.5px; color: var(--nav-text-2); font-variant-numeric: tabular-nums; }
.nfoot { margin-top: auto; padding: 10px 8px; border-top: 1px solid var(--nav-2); }
.app.mini .brand { justify-content: center; padding: 14px 0 12px; } .app.mini .brand div, .app.mini .nsec h5, .app.mini .nitem .nl, .app.mini .nitem .nh { display: none; }
.app.mini .nitem { justify-content: center; padding: 8px 0; } .app.mini .nsec { padding: 10px 6px 2px; } .app.mini .nsec + .nsec { border-top: 1px solid var(--nav-2); }
/* ---- 머리줄 ---- */
.work { min-width: 0; }
header { position: sticky; top: 0; z-index: 5; background: color-mix(in srgb, var(--surface) 88%, transparent); backdrop-filter: blur(8px); border-bottom: 1px solid var(--border); padding: 9px 18px; min-height: var(--hdr); }
header h1 { font-size: 15px; margin: 0 6px 0 0; display: inline-flex; align-items: baseline; gap: 8px; letter-spacing: -.01em; }
header h1 small { font-size: 11.5px; font-weight: 500; color: var(--text-3); }
.bar { display: flex; flex-wrap: wrap; gap: 6px 12px; align-items: center; }
.bar .sp { flex: 1; }
.ctl { display: inline-flex; align-items: center; gap: 5px; color: var(--text-2); font-size: 12px; }
select, input[type=text] { font: inherit; font-size: 12.5px; color: var(--text); background: var(--surface-2); border: 1px solid var(--border); border-radius: 7px; padding: 4px 8px; outline: none; }
#sortKey { max-width: 170px; } #fModel { max-width: 170px; }
select:focus, input[type=text]:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
.seg { display: inline-flex; border: 1px solid var(--border); border-radius: 8px; overflow: hidden; vertical-align: middle; background: var(--surface-2); padding: 2px; gap: 2px; }
.seg button { font: inherit; font-size: 12px; border: 0; background: transparent; color: var(--text-2); padding: 2px 10px; cursor: pointer; border-radius: 6px; }
.seg button:hover { color: var(--text); }
.seg button.on { background: var(--surface); color: var(--text); font-weight: 600; box-shadow: 0 1px 2px rgba(0,0,0,.12); }
.sigbar .seg button.on { background: var(--accent); color: #fff; }
.iconbtn { font: inherit; border: 1px solid var(--border); background: var(--surface-2); color: var(--text-2); border-radius: 7px; padding: 3px 9px; cursor: pointer; }
.iconbtn:hover { color: var(--text); border-color: var(--border-2); }
.layout { display: grid; grid-template-columns: 250px minmax(0, 1fr); min-height: calc(100vh - var(--hdr)); }
.layout.noside { grid-template-columns: minmax(0, 1fr); } .layout.noside aside { display: none; }
aside { border-right: 1px solid var(--border); background: var(--surface); padding: 10px; overflow: auto; max-height: calc(100vh - var(--hdr)); position: sticky; top: var(--hdr); }
aside h3 { font-size: 10.5px; letter-spacing: .06em; color: var(--text-3); margin: 12px 0 4px 6px; font-weight: 700; }
.taglist div { display: flex; justify-content: space-between; gap: 6px; padding: 3px 8px; border-radius: 6px; cursor: pointer; }
.taglist div:hover, .flist div:hover, .clist div:hover { background: var(--surface-2); }
.taglist div.on { background: var(--accent-soft); color: var(--text); font-weight: 600; }
.taglist .cnt { color: var(--text-3); font-variant-numeric: tabular-nums; white-space: nowrap; }
.flist div, .clist div { padding: 2px 8px; border-radius: 6px; cursor: pointer; display: flex; gap: 6px; align-items: center; font-variant-numeric: tabular-nums; }
.flist div.cur, .clist div.cur { background: var(--accent-soft); font-weight: 700; box-shadow: inset 2px 0 0 var(--accent); }
.flist .gh, .clist .gh { cursor: default; color: var(--text-2); font-weight: 700; margin-top: 8px; font-size: 11.5px; }
.dot { width: 8px; height: 8px; border-radius: 50%; flex: none; display: inline-block; }
.dot.n { background: var(--nor); border-radius: 2px; } .dot.a { background: var(--abn); } .dot.v { background: transparent; border: 2px solid var(--val); }
.flist .badge { margin-left: auto; color: var(--text-3); font-size: 11px; }
main { padding: 16px 20px 48px; min-width: 0; }
.vhead { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; margin: 0 0 12px; }
.vhead h2 { margin: 0; font-size: 19px; letter-spacing: -.02em; }
.vhead .crumb { color: var(--text-3); font-size: 12px; }
.card { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 12px 14px; margin-bottom: 14px; min-width: 0; box-shadow: var(--shadow); }
.card h4 { margin: 0 0 8px; font-size: 12.5px; color: var(--text); font-weight: 700; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.title { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.title .nm { font-size: 19px; font-weight: 800; letter-spacing: -.01em; }
.chip { display: inline-block; padding: 1px 9px; border-radius: 999px; font-size: 11.5px; background: var(--surface-2); color: var(--text-2); border: 1px solid var(--border); }
.chip.lab-n { border-color: var(--nor); color: var(--nor); background: var(--accent-soft); font-weight: 700; } .chip.lab-a { border-color: var(--abn); color: var(--abn); background: color-mix(in srgb, var(--abn) 10%, transparent); font-weight: 700; }
.chip.lab-v { border-color: var(--val); color: var(--val); background: color-mix(in srgb, var(--val) 10%, transparent); font-weight: 700; }
.chip.warn { background: var(--hl); color: var(--text); border-color: color-mix(in srgb, var(--hl) 60%, var(--border-2)); }
canvas { display: block; width: 100%; }
.row2 { display: grid; grid-template-columns: 1fr 2fr; gap: 14px; }
.row2e { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
.rowside { display: grid; grid-template-columns: minmax(0, 1fr) 340px; gap: 14px; align-items: start; }
.feats { display: grid; grid-template-columns: repeat(auto-fit, minmax(380px, 1fr)); gap: 14px; }
.ftable { width: 100%; border-collapse: collapse; }
.ftable td { padding: 3px 4px; border-bottom: 1px solid var(--grid); vertical-align: middle; }
.ftable td.v { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
.ftable td.p { width: 110px; }
.ftable tr.out td { background: var(--hl); }
table.big tr.zmax td, table.big tr.zmax td:first-child { background: var(--hl); font-weight: 700; }
.lnk { cursor: pointer; text-decoration: underline dotted var(--text-3); text-underline-offset: 3px; }
.lnk:hover { color: var(--accent); }
.track { position: relative; height: 12px; background: var(--surface-2); border-radius: 6px; }
.track .band { position: absolute; top: 0; bottom: 0; left: 5%; width: 90%; background: var(--nor-band); border-radius: 6px; }
.track .mid { position: absolute; top: 1px; bottom: 1px; left: 50%; width: 1px; background: var(--nor); opacity: .6; }
.track .mk { position: absolute; top: 1px; width: 10px; height: 10px; margin-left: -5px; border-radius: 50%; border: 2px solid var(--surface); }
.track .mk.ghost { background: transparent; border: 1.5px solid var(--text-3); }
.ftable td.o2 { color: var(--text-3); font-size: 11px; }
.sigbar { font-weight: 600; color: var(--text); }
.pv { font-size: 11px; color: var(--text-3); width: 34px; text-align: right; font-variant-numeric: tabular-nums; }
.fivegrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 400px), 1fr)); gap: 14px; align-items: start; }
.fivegrid .fcard { margin: 0; min-width: 0; overflow: hidden; }
.fivegrid .fcard > div { min-width: 0; }
.five .meta { font-size: 12px; }
.five .meta .nm { font-weight: 800; font-size: 14px; cursor: pointer; }
.five .meta table { border-collapse: collapse; margin-top: 4px; }
.five .meta td { padding: 0 4px 0 0; font-variant-numeric: tabular-nums; }
.five .meta tr.out td { background: var(--hl); }
.tbl-wrap { overflow: auto; max-height: calc(100vh - 150px); border: 1px solid var(--border); border-radius: 12px; background: var(--surface); box-shadow: var(--shadow); }
table.big { border-collapse: separate; border-spacing: 0; font-variant-numeric: tabular-nums; font-size: 12px; width: max-content; min-width: 100%; }
table.big th, table.big td { padding: 4px 8px; border-bottom: 1px solid var(--grid); white-space: nowrap; text-align: right; }
table.big th { position: sticky; top: 0; background: var(--surface-2); z-index: 2; cursor: pointer; font-weight: 700; color: var(--text-2); }
table.big th.s { color: var(--accent); }
table.big td.o { background: var(--hl); font-weight: 700; }
table.big td:first-child, table.big th:first-child { position: sticky; left: 0; background: var(--surface); text-align: left; z-index: 1; }
table.big th:first-child { z-index: 3; background: var(--surface-2); }
table.big tr:hover td { background: var(--surface-2); }
table.big tr.sel td { background: var(--accent-soft); }
.tip { position: fixed; pointer-events: none; background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 5px 9px; font-size: 12px; box-shadow: 0 6px 20px rgba(0,0,0,.16); display: none; z-index: 30; white-space: nowrap; }
.legend { display: inline-flex; gap: 12px; font-weight: 400; color: var(--text-2); font-size: 11.5px; flex-wrap: wrap; align-items: center; }
.legend i { display: inline-block; width: 14px; height: 3px; vertical-align: middle; margin-right: 3px; border-radius: 2px; }
.legend i.bandsw { height: 9px; background: var(--nor-band); }
.help { color: var(--text-3); font-size: 12px; font-weight: 400; }
.kbd { border: 1px solid var(--border); border-bottom-width: 2px; border-radius: 5px; padding: 0 5px; font-size: 11px; background: var(--surface-2); }
.bands { display: grid; grid-template-columns: repeat(13, 1fr); gap: 3px; align-items: end; height: 70px; }
.bands div { position: relative; background: var(--surface-2); border-radius: 3px; height: 100%; }
.bands div span { position: absolute; left: 0; right: 0; bottom: 0; border-radius: 3px; }
.bands-x { display: grid; grid-template-columns: repeat(13, 1fr); gap: 3px; font-size: 10px; color: var(--text-3); text-align: center; }
.navbtn { font: inherit; border: 1px solid var(--border); background: var(--surface-2); color: var(--text); border-radius: 7px; padding: 3px 11px; cursor: pointer; }
.navbtn:hover { border-color: var(--border-2); background: var(--surface-3); }
.navbtn.pri { background: var(--accent); border-color: var(--accent); color: #fff; }
/* 요약 숫자 */
.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; margin-bottom: 14px; }
.stat { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 10px 12px; box-shadow: var(--shadow); }
.stat .k { font-size: 11.5px; color: var(--text-3); }
.stat .v { font-size: 20px; font-weight: 800; letter-spacing: -.02em; font-variant-numeric: tabular-nums; }
.stat .s { font-size: 11.5px; color: var(--text-2); }
details.docs summary { cursor: pointer; font-weight: 700; font-size: 12.5px; }
details.docs img { max-width: 100%; border-radius: 8px; border: 1px solid var(--border); background: #fff; margin-top: 8px; }
details.docs figcaption { font-size: 12px; color: var(--text-3); margin: 2px 0 10px; }
/* 개념 */
.drawer { position: fixed; top: 0; right: 0; bottom: 0; width: min(520px, 100vw); background: var(--surface); border-left: 1px solid var(--border); box-shadow: -8px 0 24px rgba(0,0,0,.14); z-index: 20; padding: 16px 18px 30px; overflow: auto; transform: translateX(105%); transition: transform .18s; }
.drawer.open { transform: none; }
.drawer .x { position: absolute; top: 10px; right: 12px; }
.concept h2 { font-size: 17px; margin: 0 0 2px; }
.concept .sec { color: var(--text-3); font-size: 12px; margin-bottom: 8px; }
.concept dl { margin: 0; }
.concept dt { font-weight: 700; font-size: 12px; margin-top: 8px; }
.concept dt.k-data { color: var(--accent); }
.concept dt.k-warn { color: var(--abn); }
.concept dd { margin: 2px 0 0; }
.concept code { background: var(--surface-2); padding: 0 4px; border-radius: 4px; font-size: 12px; }
.concept .rel { margin-top: 12px; display: flex; flex-wrap: wrap; gap: 4px; }
.concept .rel .chip { cursor: pointer; }
.note { border-left: 3px solid var(--accent); padding: 8px 12px; background: var(--accent-soft); border-radius: 0 8px 8px 0; margin-bottom: 14px; }
.note.warn { border-left-color: var(--abn); background: color-mix(in srgb, var(--abn) 8%, transparent); }
.cgrid { display: grid; grid-template-columns: 260px 1fr; gap: 14px; }
@media (max-width: 1100px) { .rowside { grid-template-columns: 1fr; } }
@media (max-width: 900px) {
  .app, .app.mini { grid-template-columns: 1fr; }
  nav.act { position: static; height: auto; flex-direction: row; flex-wrap: wrap; } .nsec { display: flex; flex-wrap: wrap; gap: 2px; padding: 6px; } .nsec h5, .nfoot, .brand span { display: none; }
  .layout { grid-template-columns: 1fr; } aside { position: static; max-height: 240px; border-right: 0; border-bottom: 1px solid var(--border); }
  .row2, .row2e, .cgrid { grid-template-columns: 1fr; } .feats { grid-template-columns: 1fr; }
}
</style>
</head>
<body>
<div class="app" id="app">
<nav class="act" id="nav"></nav>
<div class="work">
<header>
  <div class="bar">
    <h1 id="vtitle">텐션암 EDA 뷰어</h1>
    <span class="ctl sigbar" title="고주파 탭의 그림(파형·확대·스펙트로그램·PSD)과 5개씩 보기 그림을 이 신호로 바꾼다. 저주파·충격·박자 탭은 고정 신호. 지표·태그·정상 백분위는 평균 제거(20 Hz는 raw)·200 Hz(1 kHz·1.5 kHz는 hp) 두 벌만 계산돼 있다">신호 <span class="seg" id="sig"><button data-v="raw">평균 제거</button><button data-v="hp20">20 Hz 고역</button><button data-v="hp">200 Hz 고역</button><button data-v="hp1k">1 kHz 고역</button><button data-v="hp15">1.5 kHz 고역</button></span></span>
    <span class="ctl">라벨 <select id="fLab"><option value="tr">train (정상+고장)</option><option value="0">정상</option><option value="1">고장</option><option value="val">val (라벨 없음)</option><option value="all">전체 (train+val)</option></select></span>
    <span class="ctl" title="유의미 실험(단계/5_모델비교/유의미/) 중 하나. 필터·묶기·배지·표·✕·경계·분석 조각이 모두 이 모델 기준">모델 <select id="fRef"></select></span>
    <span class="ctl">모델 결과 <select id="fModel"></select></span>
    <span class="ctl">정렬 <select id="sortKey"></select>
      <span class="seg" id="sortDir"><button data-v="1" class="on">↑</button><button data-v="-1">↓</button></span></span>
    <span class="ctl">묶기 <select id="groupBy"><option value="label">라벨</option><option value="none">없음</option><option value="model">모델 결과</option></select></span>
    <span class="ctl"><input type="text" id="q" placeholder="파일 찾기 (예: 017)" size="14"></span>
    <span class="help" id="status"></span>
    <span class="sp"></span>
    <button class="iconbtn" id="theme" title="밝게 / 어둡게 / 시스템 따라"></button>
  </div>
</header>
<div class="layout" id="layout">
  <aside id="aside"></aside>
  <main id="main"></main>
</div>
</div>
</div>
<div class="drawer" id="drawer"><button class="navbtn x" id="dx">닫기 ✕</button><div id="dbody"></div></div>
<div class="tip" id="tip"></div>

<script id="data" type="application/json">__DATA_JSON__</script>
<script>
"use strict";
const D = JSON.parse(document.getElementById("data").textContent);
const N = D.names.length;
const bytes = s => { const b = atob(s), u = new Uint8Array(b.length); for (let i = 0; i < b.length; i++) u[i] = b.charCodeAt(i); return u; };

      g.fillStyle = col(i); g.textAlign = "left"; g.fillText(t, x + dx, yv + dy - 3); break; } }

  document.getElementById("navMini").onclick = () => { S.navMini = !S.navMini; applyChrome(); render(); };
}
const THEMES = { auto: "◐ 시스템", light: "☀ 밝게", dark: "☾ 어둡게" };
function applyChrome() {
  document.getElementById("app").classList.toggle("mini", !!S.navMini);
  if (S.theme === "auto") delete document.documentElement.dataset.theme; else document.documentElement.dataset.theme = S.theme;
  document.getElementById("theme").textContent = THEMES[S.theme] || THEMES.auto;
}
document.getElementById("theme").onclick = () => { const k = Object.keys(THEMES); S.theme = k[(k.indexOf(S.theme) + 1) % k.length]; applyChrome(); render(); };

function renderConcept() {
  const q = S.cq.trim().toLowerCase(), hit = c => !q || (c.title + c.body + c.key).toLowerCase().includes(q);
  main.innerHTML = `<div class="note"><b>개념 사전은 정답이 아니라 선택지 목록입니다.</b> 노션 "도메인 지식·파이프라인" 정리를 옮기고, 항목마다
    <span style="color:var(--accent);font-weight:700">우리 데이터</span>(실험·EDA로 확인한 것)와 <span style="color:var(--abn);font-weight:700">주의</span>를 따로 적었습니다.
    지표 코드(예: <code>kurt</code>)를 클릭하면 그 지표로 정렬한 표로, Shift+클릭하면 산점도 y축으로 갑니다. 원본: <code>단계/개념사전.md</code></div>
    <div class="card cgrid"><div><input type="text" id="cq" placeholder="개념 찾기 (예: 첨도, 포락선)" style="width:100%" value="${esc(S.cq)}"><div class="clist" id="clist" style="margin-top:6px"></div></div>
    <div id="cbody"></div></div>`;
  let sec = null, html = "";
  D.concepts.filter(hit).forEach(c => { if (c.section !== sec) { html += `<div class="gh">${esc(c.section)}</div>`; sec = c.section; }
    html += `<div data-k="${c.key}" class="${c.key === S.ckey ? "cur" : ""}">${esc(c.title)}</div>`; });
  const cl = document.getElementById("clist"); cl.innerHTML = html || `<span class="help">없음</span>`;
  cl.querySelectorAll("[data-k]").forEach(el => el.onclick = () => { S.ckey = el.dataset.k; render(); });
  const cb = document.getElementById("cbody"); cb.innerHTML = conceptHTML(S.ckey) || ""; bindFeatLinks(cb);
  const cq = document.getElementById("cq"); cq.oninput = () => { S.cq = cq.value; const pos = cq.selectionStart; render(); const n = document.getElementById("cq"); n.focus(); n.setSelectionRange(pos, pos); };
}

// ---------- 옆 목록·태그 ----------
function renderSide() {
  const A = document.getElementById("aside");
  const nA = D.y.reduce((a, b) => a + b, 0), nN = G.filter(g => g === 0).length, nV = N - nN - nA;
  let h = `<h3>태그 (클릭 = 거르기, 정상/고장 수)</h3><div class="taglist"><div data-t="" class="${S.tag ? "" : "on"}"><span>모든 태그</span><span class="cnt">${nN} / ${nA}${nV ? " / " + nV : ""}</span></div>` +
    D.tags.map(t => { let n = 0, a = 0, v = 0; for (let i = 0; i < N; i++) if (D.ftags[i].includes(t.key)) G[i] === 1 ? a++ : G[i] === 0 ? n++ : v++;
      return `<div data-t="${t.key}" class="${S.tag === t.key ? "on" : ""}" title="${esc(t.desc)}"><span>${t.label}</span><span class="cnt">${n} / ${a}${nV ? " / " + v : ""}</span></div>`; }).join("") + `</div>`;
  const cur = S.list[S.pos], p0 = Math.floor(S.pos / 5) * 5; let lastG = null, fl = "";
  S.list.forEach((i, p) => {
    const g = groupOf(i); if (S.group !== "none" && g !== lastG) { fl += `<div class="gh">${g}</div>`; lastG = g; }
    const on = S.mode === "five" ? p >= p0 && p < p0 + 5 : i === cur, sv = S.sort !== "name" ? fmt(D.val[S.sort][i], S.sort) : "";
    fl += `<div data-p="${p}" class="${on ? "cur" : ""}"><span class="dot ${dotCls(i)}"></span>${D.names[i]}<span class="badge">${sv}</span></div>`;
  });
  h += `<h3>파일 ${S.list.length}개${S.sort !== "name" ? " · 오른쪽 = " + FEAT[S.sort].label : ""}</h3><div class="flist">${fl || '<span class="help">없음</span>'}</div>`;
  A.innerHTML = h;
  A.querySelectorAll(".taglist div").forEach(d => d.onclick = () => { S.tag = d.dataset.t || null; update(); });
  A.querySelectorAll(".flist div[data-p]").forEach(d => d.onclick = () => { S.pos = +d.dataset.p; if (!["one", "five"].includes(S.mode)) S.mode = "one"; syncCtl(); render(); });
  const el = A.querySelector(".flist .cur"); if (el) el.scrollIntoView({ block: "nearest" });
}

// ---------- 컨트롤 ----------
function segBind(id, fn) { document.querySelectorAll(`#${id} button`).forEach(b => b.onclick = () => fn(b.dataset.v)); }
function syncCtl() {
  document.querySelectorAll("#mode button").forEach(b => b.classList.toggle("on", b.dataset.v === S.mode));
  document.querySelectorAll("#sortDir button").forEach(b => b.classList.toggle("on", +b.dataset.v === S.dir));
  document.querySelectorAll("#sig button").forEach(b => b.classList.toggle("on", b.dataset.v === S.sig));
  document.getElementById("fLab").value = S.lab; document.getElementById("fRef").value = S.ref;
  const fm = document.getElementById("fModel"); fm.innerHTML = modelOptions(); fm.value = S.model;
  if (fm.value !== S.model) { S.model = "all"; fm.value = "all"; }      // 고른 모델에 없는 항목(다른 모델의 규칙 등)이면 전체로
  document.getElementById("sortKey").value = S.sort; document.getElementById("groupBy").value = S.group; document.getElementById("q").value = S.q;
}
function setMode(m) { S.mode = m; syncCtl(); render(); }
function step(d) { if (!S.list.length) return; S.pos = Math.max(0, Math.min(S.list.length - 1, S.pos + d)); render(); }
function update() { rebuild(); render(); }
function render() {
  save(); tip.style.display = "none";
  document.getElementById("layout").classList.toggle("noside", !FILE_MODES.includes(S.mode));
  const [sec, vn] = VNAME[S.mode] || ["", ""];
  document.getElementById("vtitle").innerHTML = `${vn} <small>${sec}</small>`;
  document.title = `${vn} · 텐션암 EDA 뷰어`;
  renderNav();
  ({ one: renderOne, five: renderFive, table: renderTable, scatter: renderScatter, lr: renderLR, knock: renderKnock, lock: renderLock, concept: renderConcept })[S.mode]();
  renderSide();
  document.getElementById("status").innerHTML = S.mode === "one" ? `<span class="kbd">←</span> <span class="kbd">→</span> 파일 이동` : S.mode === "five" ? `<span class="kbd">←</span> <span class="kbd">→</span> 5개씩 이동` : "";
}
document.getElementById("sortKey").innerHTML = `<option value="name">파일 이름</option>` + featOptions();
segBind("sortDir", v => { S.dir = +v; syncCtl(); update(); });
segBind("sig", v => { useSig(v); if (S.tag && !TAG[S.tag]) S.tag = null; syncCtl(); rebuild(); render(); });
document.getElementById("fLab").onchange = e => { S.lab = e.target.value; update(); };
document.getElementById("fModel").onchange = e => { S.model = e.target.value; update(); };
document.getElementById("fRef").innerHTML = MODELS.map(m => `<option value="${m.id}" title="${modelTitle(m)}">${esc(modelLabel(m))}</option>`).join("");
document.getElementById("fRef").onchange = e => { S.ref = e.target.value; syncCtl(); update(); };
document.getElementById("sortKey").onchange = e => { S.sort = e.target.value; update(); };
document.getElementById("groupBy").onchange = e => { S.group = e.target.value; update(); };
document.getElementById("q").oninput = e => { S.q = e.target.value.trim(); update(); };
addEventListener("keydown", e => {
  if (e.key === "Escape") return closeDrawer();
  if (["INPUT", "SELECT"].includes(e.target.tagName)) return;
  const k = S.mode === "five" ? 5 : 1;
  if (!["one", "five"].includes(S.mode)) return;
  if (e.key === "ArrowRight") { step(k); e.preventDefault(); } else if (e.key === "ArrowLeft") { step(-k); e.preventDefault(); }
});
let rt; addEventListener("resize", () => { clearTimeout(rt); rt = setTimeout(render, 150); });
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", render);
if (S.sort !== "name" && !FEAT[S.sort]) S.sort = "name";
if (!FEAT[S.sx]) S.sx = "std"; if (!FEAT[S.sy]) S.sy = "prot"; if (!CON[S.ckey]) S.ckey = D.concepts[0].key;
if (!MODES.includes(S.mode)) S.mode = "one";
if (!THEMES[S.theme]) S.theme = "auto";
const hm = location.hash.slice(1); if (MODES.includes(hm)) S.mode = hm;
applyChrome(); syncCtl(); rebuild(); render();
</script>
</body>
</html>
